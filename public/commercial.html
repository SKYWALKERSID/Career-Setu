<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerSetu — 1080p 60fps Launch Commercial</title>
  <style>
    :root {
      --bg-navy: #0A1128;
      --bg-slate: #0F172A;
      --cyan: #06B6D4;
      --teal: #14B8A6;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 15%, #0F172A 0%, #0A1128 85%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px 48px;
    }
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: linear-gradient(90deg, var(--cyan), var(--teal));
      color: var(--bg-navy);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.14em;
      padding: 5px 12px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--bg-slate);
      transition: all 0.2s ease;
    }
    .btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--cyan), var(--teal));
      color: var(--bg-navy);
      border: none;
    }
    .player-shell {
      width: 100%;
      max-width: 1280px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(6, 182, 212, 0.55);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85), 0 0 50px rgba(6, 182, 212, 0.22);
      background: #000;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
    }
    .chapters {
      width: 100%;
      max-width: 1280px;
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    .chapter-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chapter-btn:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }
    .chapter-time {
      font-size: 11px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.08em;
    }
    .chapter-name {
      font-size: 13.5px;
      font-weight: 700;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="badge">1080p 60fps • Gemini Studio Voice</span>
      <h1>CareerSetu — Official Launch Commercial</h1>
    </div>
    <div class="actions">
      <a class="btn" href="/presentation.html">📊 18-Slide Presentation Deck</a>
      <a class="btn" href="/">🚀 Open Live Platform</a>
      <a class="btn btn-primary" href="/careersetu-cinematic-ad.mp4" download>⬇ Download MP4</a>
    </div>
  </header>

  <div class="player-shell">
    <video id="ad-video" controls autoplay playsinline preload="metadata">
      <source src="/careersetu-cinematic-ad.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
  </div>

  <div class="chapters">
    <button class="chapter-btn" onclick="seekTo(0)">
      <div class="chapter-time">SCENE 01 • 00:00</div>
      <div class="chapter-name">The Hook: Readiness → Action</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(10.59)">
      <div class="chapter-time">SCENE 02 • 00:10</div>
      <div class="chapter-name">Rapid Persona Onboarding</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(20.18)">
      <div class="chapter-time">SCENE 03 • 00:20</div>
      <div class="chapter-name">0–100 Explainable Readiness Score</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(31.32)">
      <div class="chapter-time">SCENE 04 • 00:31</div>
      <div class="chapter-name">AI Career Fit & Skill-Gap Engine</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(41.00)">
      <div class="chapter-time">SCENE 05 • 00:41</div>
      <div class="chapter-name">90-Day Execution Roadmap</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(50.48)">
      <div class="chapter-time">SCENE 06 • 00:50</div>
      <div class="chapter-name">Curated Opportunity Matching</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(60.19)">
      <div class="chapter-time">SCENE 07 • 01:00</div>
      <div class="chapter-name">Evidence-Grounded Resume Copilot</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(70.17)">
      <div class="chapter-time">SCENE 08 • 01:10</div>
      <div class="chapter-name">AI Mock Interview & STAR Rubric</div>
    </button>
    <button class="chapter-btn" onclick="seekTo(79.50)">
      <div class="chapter-time">SCENE 09 • 01:19</div>
      <div class="chapter-name">Institutional Analytics & Outro</div>
    </button>
  </div>

  <script>
    const video = document.getElementById('ad-video');
    function seekTo(sec) {
      video.currentTime = sec;
      video.play();
    }
  </script>
</body>
</html>
